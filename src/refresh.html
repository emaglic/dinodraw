<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Dino Draw Refresh</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #ffffff;
        color: #000000;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        padding: 16px;
      }

      main {
        width: min(420px, 100%);
        padding: 16px;
        border: 2px solid #000000;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 3px 0 #000000;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 24px;
        line-height: 1.1;
      }

      p {
        margin: 0 0 16px;
        font-size: 15px;
        line-height: 1.35;
      }

      button {
        min-height: 38px;
        padding: 0 12px;
        border: 2px solid #000000;
        border-radius: 6px;
        background: #ffffff;
        color: #000000;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Refreshing Dino Draw</h1>
      <p data-status>Clearing the app cache...</p>
      <button type="button" data-retry hidden>Open Dino Draw</button>
    </main>
    <script>
      (function () {
        var status = document.querySelector("[data-status]");
        var retryButton = document.querySelector("[data-retry]");

        function setStatus(message) {
          if (status) {
            status.textContent = message;
          }
        }

        function openApp() {
          window.location.replace("./index.html?refresh=" + Date.now());
        }

        function showRetry() {
          if (retryButton) {
            retryButton.hidden = false;
          }
        }

        function clearServiceWorkers() {
          if (!("serviceWorker" in navigator)) {
            return Promise.resolve();
          }

          return navigator.serviceWorker.getRegistrations().then(function (registrations) {
            return Promise.all(
              registrations.map(function (registration) {
                return registration.unregister();
              })
            );
          });
        }

        function clearCaches() {
          if (!("caches" in window)) {
            return Promise.resolve();
          }

          return caches.keys().then(function (cacheNames) {
            return Promise.all(
              cacheNames.map(function (cacheName) {
                if (cacheName.indexOf("dinodraw-") === 0) {
                  return caches.delete(cacheName);
                }

                return Promise.resolve();
              })
            );
          });
        }

        if (retryButton) {
          retryButton.addEventListener("click", openApp);
        }

        clearServiceWorkers()
          .then(clearCaches)
          .then(function () {
            setStatus("Cache cleared. Opening the latest app...");
            window.setTimeout(openApp, 500);
          })
          .catch(function () {
            setStatus("Cache clearing was blocked. Try opening Dino Draw again.");
            showRetry();
          });
      })();
    </script>
  </body>
</html>
